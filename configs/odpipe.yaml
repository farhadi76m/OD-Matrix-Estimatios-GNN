# odpipe.yaml — general OD-estimation pipeline (any zone count / demand range).
# Change `taz.width` and `demand_range` and re-run the pipeline; nothing else is
# hard-coded to a zone count (it is read from the generated TAZ file everywhere).
# See README_odpipe.md.

paths:
  net_file:    "sumo/prune_tab.net.xml"     # SUMO network (unchanged input)
  taz_file:    "sumo/taz_od.xml"            # generated by src.odpipe.taz
  data_dir:    "data_od"
  graph_cache: "data_od/graph.pkl"
  samples_dir: "data_od/samples"
  manifest:    "data_od/index.json"
  checkpoint:  "data_od/best.pt"
  metrics:     "data_od/metrics.json"
  predictions: "data_od/test_predictions.npz"

taz:
  width: 2000                 # gridDistricts grid cell width (m). 2000 -> ~13 zones.

# ── dataset ──────────────────────────────────────────────────────────────────
demand_range: [2000, 30000]   # total trips/hour per sample (min -> max)
n_tiers: 4
tier_labels: ["light", "moderate", "heavy", "gridlock"]   # demand-magnitude tiers
n_samples: 1500
od_mix: {gravity: 0.5, dirichlet: 0.3, sparse: 0.2}       # OD structure mix
mesoscopic: true              # fast queue-based SUMO — essential at high demand
n_workers: 8
master_seed: 42
sim_seed: 7
split:
  fractions: {train: 0.7, val: 0.15, test: 0.15}
  seed: 0

# ── training ─────────────────────────────────────────────────────────────────
train:
  seed: 42
  batch_size: 16
  lr: 0.003
  weight_decay: 1.0e-4
  epochs: 80
  warmup_epochs: 5
  patience: 15
  grad_clip: 2.0

# ── gravity reconstruction ───────────────────────────────────────────────────
furness:
  beta: 1.0
  betas: [0.3, 0.5, 0.7, 1.0, 1.5, 2.0]     # swept on TRUE marginals for the ceiling
  iters: 40
